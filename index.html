<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101014">
  <title>Veditalk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-icon">✦</div><span>vedi<span class="purple">talk</span></span><button class="icon-btn mobile-close" id="closeSidebar">×</button></div>
      <button class="new-chat" id="newChat">＋ New chat</button>
      <section class="history" id="historySection" hidden><div class="history-heading"><span>RECENT</span><button id="clearHistory" class="text-btn">Clear</button></div><div id="historyList"></div></section>
      <div class="sidebar-bottom">
        <button class="upgrade" id="upgradeButton"><span>✧</span><span><b>Support Veditalk</b><small>Help the project grow</small></span><span class="upgrade-arrow">↗</span></button>
        <button class="account" id="accountButton"><span class="avatar" id="accountAvatar">G</span><span><b id="accountName">Guest</b><small id="accountStatus">Not signed in</small></span></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar"><button class="icon-btn menu-btn" id="openSidebar">☰</button><div class="topbar-title">Veditalk <span class="preview">PAPEROFFICE</span></div><div class="top-actions"><button class="icon-btn" id="themeButton" title="Change theme">☼</button><button class="login-btn" id="loginButton">Log in</button></div></header>
      <section class="chat">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">✦</div><p class="eyebrow">YOUR AI SPACE</p><h1>What can I help<br><span>you with?</span></h1><p class="subtitle">Work with documents, translate text, create images, and explore tools.</p>
          <div class="suggestions">
            <button class="suggestion" data-feature="summarize" data-prompt="Summarize this document."><span>▤</span><b>Summarize a file</b><small>Get the key points</small></button>
            <button class="suggestion" data-feature="translate" data-prompt="Hello, how are you?"><span>文</span><b>Translate text</b><small>Switch between languages</small></button>
            <button class="suggestion" data-feature="image-gen" data-prompt="A tiny astronaut exploring a glowing garden on the moon."><span>✧</span><b>Create an image</b><small>Turn a prompt into artwork</small></button>
            <button class="suggestion" data-feature="ocr" data-prompt=""><span>⌕</span><b>Read a document</b><small>Extract text from a file</small></button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="composer-wrap">
          <div class="attachments" id="attachments" hidden></div>
          <div class="composer">
            <div class="feature-row"><label for="featureSelect">TOOL</label><select id="featureSelect">
              <option value="chat">Chat</option><option value="ocr">Text recognition (OCR)</option><option value="translate">Translate text</option><option value="summarize">Summarize / analyze document</option><option value="image-analyze">Analyze image</option><option value="handwriting">Recognize handwriting</option><option value="sentiment">Sentiment analysis</option><option value="extract">Extract names and data</option><option value="tts">Text to speech</option><option value="stt">Speech to text</option><option value="image-gen">Generate image</option><option value="currency">Currency converter</option><option value="weather">Weather lookup</option><option value="address">Address lookup</option><option value="demo">API demo / connection test</option>
            </select></div>
            <div class="tool-options" id="toolOptions" hidden>
              <div id="languageOptions" hidden><label for="targetLanguage">TARGET LANGUAGE</label><select id="targetLanguage"><option value="en">English</option><option value="ar">Arabic</option><option value="de">German</option><option value="fr">French</option><option value="es">Spanish</option><option value="it">Italian</option><option value="pt">Portuguese</option><option value="nl">Dutch</option><option value="zh">Chinese</option><option value="ja">Japanese</option><option value="tr">Turkish</option><option value="ru">Russian</option><option value="hi">Hindi</option></select></div>
              <div id="lookupOptions" hidden><label for="lookupInput" id="lookupLabel">LOOKUP</label><input id="lookupInput" type="text" placeholder="Enter a city or address"></div>
              <div id="currencyOptions" hidden><label for="currencyAmount">AMOUNT</label><input id="currencyAmount" type="number" min="0" step="any" value="1"><label for="currencyFrom">FROM</label><select id="currencyFrom"><option>MYR</option><option>USD</option><option>EUR</option><option>GBP</option><option>JPY</option><option>SGD</option><option>AUD</option><option>CAD</option></select><label for="currencyTo">TO</label><select id="currencyTo"><option>USD</option><option>MYR</option><option>EUR</option><option>GBP</option><option>JPY</option><option>SGD</option><option>AUD</option><option>CAD</option></select></div>
            </div>
            <textarea id="messageInput" rows="1" maxlength="8000" placeholder="Choose a tool and enter your request..."></textarea>
            <div class="composer-bottom"><div class="tools"><input type="file" id="fileInput" accept="image/*,.pdf,audio/*,.doc,.docx" multiple hidden><button class="tool-btn" id="attachButton">＋ Attach file</button><span class="file-hint">Images, PDF, audio</span></div><button class="send-btn" id="sendButton" disabled>↑</button></div>
          </div>
          <p class="disclaimer">Guest chats are temporary. Publishable key is origin-locked and credit-limited.</p>
        </div>
      </section>
    </main>
  </div>
  <div class="modal-backdrop" id="modal" hidden><div class="modal"><button class="icon-btn modal-close" id="closeModal">×</button><div class="modal-icon">✦</div><h2 id="modalTitle">Veditalk</h2><p id="modalDescription"></p><p class="modal-note" id="modalNote"></p><button class="primary-btn" id="modalOkay">Got it</button></div></div>
  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
